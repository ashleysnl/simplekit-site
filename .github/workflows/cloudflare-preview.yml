name: Manual Cloudflare preview

# Deliberately not triggered by pushes or PRs. This project must be separate
# from production, with its production branch set to __production_disabled__.
on:
  workflow_dispatch:
    inputs:
      full_qa:
        description: Repeat complete production-artifact regression in addition to deployed smoke checks
        required: false
        default: false
        type: boolean
      source_ref:
        description: Feature branch or commit to preview
        required: true
        type: string

      baseline_url:
        description: Optional existing isolated preview for before screenshots
        required: false
        default: https://e9070fe2.simplekit-preview.pages.dev
        type: string

permissions:
  contents: read

jobs:
  build:
    outputs:
      candidate_sha: ${{ steps.candidate.outputs.commit }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - run: npm run sources:fetch && npm run build
      - if: inputs.full_qa
        run: npm test && npm run seo:validate && npm run output:validate
      - name: Record candidate identity and optional full QA preservation
        id: candidate
        run: |
          if [ "${{ inputs.full_qa }}" = "true" ]; then
            node scripts/v2-baseline-inventory.mjs
          fi
          node scripts/v2-release-artifact.mjs --record "$RUNNER_TEMP/release-inventory.json"
          if [ "${{ inputs.full_qa }}" = "true" ]; then
            npm run build
            node scripts/v2-release-artifact.mjs --compare "$RUNNER_TEMP/release-inventory.json"
          fi
          tar --sort=name --mtime='UTC 2026-01-01' --owner=0 --group=0 --numeric-owner -cf "$RUNNER_TEMP/release-candidate.tar" -C dist .
          gzip -n "$RUNNER_TEMP/release-candidate.tar"
          sha256sum "$RUNNER_TEMP/release-candidate.tar.gz" > "$RUNNER_TEMP/release-candidate.sha256"
          git rev-parse HEAD > "$RUNNER_TEMP/release-source.txt"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate-${{ steps.candidate.outputs.commit }}
          path: |
            ${{ runner.temp }}/release-candidate.tar.gz
            ${{ runner.temp }}/release-candidate.sha256
            ${{ runner.temp }}/release-inventory.json
            ${{ runner.temp }}/release-source.txt
          if-no-files-found: error
          retention-days: 30
      - name: Verify the production artifact still matches completed Phase 16 QA
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import assert from 'node:assert/strict';
          const qa=JSON.parse(fs.readFileSync('docs/v2/phase-16/current/qa-evidence.json')).release;
          const inventory=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/release-inventory.json'));
          assert.equal(inventory.inventorySHA256,qa.inventorySHA256,'New runtime changes require Phase 16 QA before preview');
          const archive=fs.readFileSync(process.env.RUNNER_TEMP+'/release-candidate.tar.gz');
          assert.equal(crypto.createHash('sha256').update(archive).digest('hex'),qa.archiveSHA256);
          console.log('Production-ready bytes exactly match the verified Phase 16 candidate.');
          JS
      - name: Isolate preview indexing and hostname
        run: |
          node scripts/prepare-preview.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-site
          path: dist/
          if-no-files-found: error
          retention-days: 7
  preview:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: simplekit-preview
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: preview-site
          path: dist/
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidate-${{ needs.build.outputs.candidate_sha }}
          path: ${{ runner.temp }}/preview-release
      - name: Verify the dedicated preview project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          account = os.environ['CLOUDFLARE_ACCOUNT_ID']
          token = os.environ['CLOUDFLARE_API_TOKEN']
          assert account and token, 'Configure the simplekit-preview environment first'
          request = urllib.request.Request(
              f'https://api.cloudflare.com/client/v4/accounts/{account}/pages/projects/simplekit-preview',
              headers={'Authorization': f'Bearer {token}'})
          with urllib.request.urlopen(request, timeout=30) as response:
              data = json.load(response)
          assert data.get('success'), 'Cloudflare project read failed'
          project = data['result']
          assert project['name'] == 'simplekit-preview'
          assert project['production_branch'] == '__production_disabled__', 'Refusing a production-capable project'
          assert not project.get('domains') or all(d.endswith('.pages.dev') for d in project['domains']), 'Refusing custom domains'
          PY
      - name: Prepare isolated browser verification
        run: |
          npm install --prefix "$RUNNER_TEMP/simplekit-v2-browser" --no-save playwright@1.56.1 axe-core@4.10.3 lighthouse@12.8.2
          if [ "${{ inputs.full_qa }}" = "true" ]; then
            "$RUNNER_TEMP/simplekit-v2-browser/node_modules/.bin/playwright" install --with-deps chromium firefox webkit
          else
            "$RUNNER_TEMP/simplekit-v2-browser/node_modules/.bin/playwright" install --with-deps chromium
          fi
      - name: Capture the previous hosted preview
        if: inputs.full_qa && inputs.baseline_url != ''
        continue-on-error: true
        shell: bash
        env:
          SIMPLEKIT_HOSTED_PREVIEW: '1'
          SIMPLEKIT_PREVIEW_URL: ${{ inputs.baseline_url }}
        run: |
          mkdir -p "$RUNNER_TEMP/preview-browser-evidence/before"
          NODE_PATH="$RUNNER_TEMP/simplekit-v2-browser/node_modules" SIMPLEKIT_EVIDENCE_DIR="$RUNNER_TEMP/preview-browser-evidence/before" node tests/v2-fidelity-screenshots.cjs 2>&1 | tee "$RUNNER_TEMP/preview-browser-evidence/before/capture.log"
          mkdir -p "$RUNNER_TEMP/preview-browser-evidence/baseline-lighthouse"
          NODE_PATH="$RUNNER_TEMP/simplekit-v2-browser/node_modules" SIMPLEKIT_EVIDENCE_DIR="$RUNNER_TEMP/preview-browser-evidence/baseline-lighthouse" node tests/v2-lighthouse.cjs 2>&1 | tee "$RUNNER_TEMP/preview-browser-evidence/baseline-lighthouse/lighthouse.log"
      - name: Upload a preview branch only
        id: upload
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/preview-browser-evidence"
          npm exec --yes --package=wrangler@4.45.0 -- wrangler pages deploy dist --project-name=simplekit-preview --branch=codex-preview 2>&1 | tee "$RUNNER_TEMP/preview-browser-evidence/upload.log"
          python3 - <<'PYCODE'
          import os, pathlib, re
          text = (pathlib.Path(os.environ['RUNNER_TEMP']) / 'preview-browser-evidence/upload.log').read_text()
          urls = re.findall(r'https://[a-z0-9-]+\.simplekit-preview\.pages\.dev', text)
          assert urls, 'Upload did not report an isolated preview URL'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('url=' + urls[0] + '\n')
          PYCODE
      - name: Verify and capture the deployed preview
        shell: bash
        env:
          SIMPLEKIT_HOSTED_PREVIEW: '1'
          SIMPLEKIT_PREVIEW_URL: ${{ steps.upload.outputs.url }}
        run: |
          export NODE_PATH="$RUNNER_TEMP/simplekit-v2-browser/node_modules"
          export SIMPLEKIT_EVIDENCE_DIR="$RUNNER_TEMP/preview-browser-evidence/after"
          mkdir -p "$SIMPLEKIT_EVIDENCE_DIR"
          node tests/v2-hosted-preview-smoke.cjs 2>&1 | tee "$SIMPLEKIT_EVIDENCE_DIR/http.log"
          node tests/v2-fidelity-screenshots.cjs 2>&1 | tee "$SIMPLEKIT_EVIDENCE_DIR/capture.log"
          # Phase 16 owns the complete matrix. Verify deployed bytes and actual
          # calculator interactions here without repeating all visual suites.
          node tests/v2-baseline-browser.cjs 2>&1 | tee "$SIMPLEKIT_EVIDENCE_DIR/calculators.log"
          node tests/v2-release-browser.cjs 2>&1 | tee "$SIMPLEKIT_EVIDENCE_DIR/state-export.log"
          node tests/v2-retirement-fallback-browser.cjs 2>&1 | tee "$SIMPLEKIT_EVIDENCE_DIR/fallback.log"
          export SIMPLEKIT_PREVIEW_ALIAS=https://codex-preview.simplekit-preview.pages.dev
          export SIMPLEKIT_RELEASE_DIR="$RUNNER_TEMP/preview-release"
          export SIMPLEKIT_CANDIDATE_SHA="$(cat "$SIMPLEKIT_RELEASE_DIR/release-source.txt")"
          export SIMPLEKIT_CANDIDATE_ARCHIVE_SHA256="$(node -p "require('./docs/v2/phase-16/current/qa-evidence.json').release.archiveSHA256")"
          export SIMPLEKIT_PREVIEW_ROUTING=1
          node tests/v2-preview-review.cjs 2>&1 | tee "$SIMPLEKIT_EVIDENCE_DIR/artifact.log"
          node tests/v2-preview-navigation.cjs 2>&1 | tee "$SIMPLEKIT_EVIDENCE_DIR/navigation.log"

      - name: Repeat production-artifact regression when explicitly requested
        if: inputs.full_qa
        shell: bash
        env:
          SIMPLEKIT_HOSTED_PREVIEW: '0'
          SIMPLEKIT_PREVIEW_URL: http://127.0.0.1:8009
        run: |
          export NODE_PATH="$RUNNER_TEMP/simplekit-v2-browser/node_modules"
          # Broad canonical-link assertions describe the production artifact.
          # Preview navigation is covered separately by real hosted click tests.
          mv dist "$RUNNER_TEMP/reviewed-preview-dist"
          mkdir dist
          tar -xzf "$RUNNER_TEMP/preview-release/release-candidate.tar.gz" -C dist
          PORT=8009 node scripts/preview.mjs > "$RUNNER_TEMP/production-regression-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..40}; do
            if curl -fsS "$SIMPLEKIT_PREVIEW_URL/" > /dev/null; then break; fi
            sleep .25
          done
          for suite in v2-header-hero v2-discovery v2-trust v2-goals v2-featured v2-onboarding v2-baseline v2-release; do
            export SIMPLEKIT_EVIDENCE_DIR="$RUNNER_TEMP/preview-browser-evidence/regression/$suite"
            mkdir -p "$SIMPLEKIT_EVIDENCE_DIR"
            node "tests/$suite-browser.cjs" 2>&1 | tee "$SIMPLEKIT_EVIDENCE_DIR/browser.log"
          done
          export SIMPLEKIT_EVIDENCE_DIR="$RUNNER_TEMP/preview-browser-evidence/phase-14/pilots"
          mkdir -p "$SIMPLEKIT_EVIDENCE_DIR"
          SIMPLEKIT_BROWSER_ENGINES=chromium,firefox,webkit node tests/v2-pilot-browser.cjs 2>&1 | tee "$SIMPLEKIT_EVIDENCE_DIR/browser.log"
          export SIMPLEKIT_EVIDENCE_DIR="$RUNNER_TEMP/preview-browser-evidence/phase-08/accessibility"
          mkdir -p "$SIMPLEKIT_EVIDENCE_DIR"
          SIMPLEKIT_BROWSER_ENGINES=chromium,firefox,webkit node tests/v2-accessibility-browser.cjs 2>&1 | tee "$SIMPLEKIT_EVIDENCE_DIR/browser.log"
          export SIMPLEKIT_EVIDENCE_DIR="$RUNNER_TEMP/preview-browser-evidence/phase-08/lighthouse"
          mkdir -p "$SIMPLEKIT_EVIDENCE_DIR"
          node tests/v2-lighthouse.cjs 2>&1 | tee "$SIMPLEKIT_EVIDENCE_DIR/lighthouse.log"
          export SIMPLEKIT_EVIDENCE_DIR="$RUNNER_TEMP/preview-browser-evidence/phase-09"
          mkdir -p "$SIMPLEKIT_EVIDENCE_DIR"
          node tests/v2-seo-browser.cjs 2>&1 | tee "$SIMPLEKIT_EVIDENCE_DIR/browser.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: preview-browser-evidence
          path: ${{ runner.temp }}/preview-browser-evidence/
          if-no-files-found: warn
          retention-days: 7
